name: Template Tests

on:
  pull_request:
    branches: [main, develop]

  workflow_dispatch:

env:
  TEMPLATE_VERSION: 3.8.5
  # Should be kept in step with MonoGame's build workflow.
  DotnetVersion: 9.0.314
  XCodeVersion: 26.3
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

concurrency:
  group: template-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-templates:
    name: templates-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Checkout current repo
        uses: actions/checkout@v7

      # Pins the SDK so the workloads below match it. TestNuGetSetup copies this file into the test folder.
      - name: Generate global.json
        shell: bash
        run: |
          echo '{ "sdk": { "version": "${{ env.DotnetVersion }}" } }' > global.json

      - name: Setup .NET Core SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "${{ env.DotnetVersion }}"
          global-json-file: "./global.json"

      - name: Setup Android dependencies
        if: runner.os != 'macOS'
        uses: monogame/monogame-actions/install-android-dependencies@v1.0.3

      - name: Setup DotNet on Windows
        if: runner.environment == 'github-hosted' && runner.os == 'windows'
        run: |
          dotnet workload install android ios --version ${{ env.DotnetVersion }}

      - name: Setup DotNet on linux
        if: runner.environment == 'github-hosted' && runner.os == 'Linux' && runner.arch == 'x64'
        run: |
          dotnet workload install android --version ${{ env.DotnetVersion }}

      - name: Setup DotNet on MacOS
        if: runner.os == 'macos'
        run: |
          dotnet workload install macos ios --version ${{ env.DotnetVersion }}

      - name: Pin Xcode version
        if: runner.os == 'macOS'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCodeVersion }}

      - name: Add msbuild to PATH
        if: runner.os == 'Windows'
        uses: microsoft/setup-msbuild@v1.0.2

      - name: Build
        run: dotnet run --project build/Build.csproj -- --target=Default --build-version=${{ env.TEMPLATE_VERSION }}

      - name: Test generated Nuget packages
        run: dotnet run --project build/Build.csproj -- --target=TestNuGet --build-version=${{ env.TEMPLATE_VERSION }} --strict=true

      - name: Upload logs and results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: template-tests-${{ matrix.os }}
          path: |
            Artifacts/TemplateTests/results.md
            Artifacts/TemplateTests/logs/**
          retention-days: 7
